spring:
  application:
    name: room-reservation-api

  datasource:
    url: jdbc:postgresql://localhost:5432/room_reservation
    username: postgres
    password: 1425
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    com.roomreservation: INFO
    org.hibernate.SQL: WARN
